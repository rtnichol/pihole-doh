# ]


##############################################
# Prometheus metrics endpoint (optional)
# Exposes query stats at http://host:8053/metrics
##############################################

[metrics]
  prefix = "dnscrypt_proxy"

[http_proxy]
  # leave blank unless you're behind an explicit proxy


